<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind CSS -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        danaher: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',  // 丹纳赫主紫色
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-danaher-gradient {
                background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(124, 58, 237, 0.15);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-danaher-500 focus:border-danaher-500 focus:outline-none;
            }
        }
    </style>
</head>
<body class="bg-danaher-50 min-h-screen">
    <!-- 顶部导航栏 -->
    <header class="bg-danaher-gradient text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-search text-xl"></i>
                <h1 class="text-lg font-bold">IB设备查询</h1>
            </div>
            <div class="text-sm opacity-90">共<span id="total-count" class="font-semibold">0</span>条记录</div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-5">
        <!-- 查询区域 -->
        <div class="bg-white rounded-xl p-4 mb-5 card-shadow">
            <h2 class="text-lg font-semibold text-danaher-800 mb-4 flex items-center">
                <i class="fa fa-filter mr-2"></i>查询条件
            </h2>
            
            <div class="grid grid-cols-1 gap-4">
                <!-- PARTY_NAME查询 -->
                <div>
                    <label for="partyName" class="block text-sm font-medium text-gray-700 mb-1">
                        客户名称 (PARTY_NAME)
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-building"></i>
                        </span>
                        <input type="text" id="partyName" 
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg input-focus"
                               placeholder="输入客户名称关键词...">
                    </div>
                </div>
                
                <!-- MODEL_TEST查询 -->
                <div>
                    <label for="modelTest" class="block text-sm font-medium text-gray-700 mb-1">
                        设备型号 (MODEL_TEST)
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-cogs"></i>
                        </span>
                        <input type="text" id="modelTest" 
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg input-focus"
                               placeholder="输入设备型号关键词...">
                    </div>
                </div>
                
                <!-- SERIAL_NUMBER查询 -->
                <div>
                    <label for="serialNumber" class="block text-sm font-medium text-gray-700 mb-1">
                        序列号 (SERIAL_NUMBER)
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-barcode"></i>
                        </span>
                        <input type="text" id="serialNumber" 
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg input-focus"
                               placeholder="输入序列号关键词...">
                    </div>
                </div>
                
                <!-- 按钮区域 -->
                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <button id="searchBtn" 
                            class="flex-1 bg-danaher-600 hover:bg-danaher-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                        <i class="fa fa-search mr-2"></i>查询
                    </button>
                    <button id="resetBtn" 
                            class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                        <i class="fa fa-refresh mr-2"></i>复位
                    </button>
                    <button id="exportBtn" 
                            class="flex-1 bg-danaher-500 hover:bg-danaher-600 text-white font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                        <i class="fa fa-download mr-2"></i>导出
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 查询结果区域 -->
        <div class="bg-white rounded-xl p-4 card-shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-danaher-800 flex items-center">
                    <i class="fa fa-table mr-2"></i>查询结果
                </h2>
                <div class="text-sm text-gray-600">找到 <span id="result-count" class="font-semibold text-danaher-600">0</span> 条记录</div>
            </div>
            
            <!-- 结果表格 -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-danaher-50">
                        <tr>
                            <th scope="col" class="px-3 py-2 text-left text-xs font-medium text-danaher-800 uppercase tracking-wider">
                                客户名称
                            </th>
                            <th scope="col" class="px-3 py-2 text-left text-xs font-medium text-danaher-800 uppercase tracking-wider">
                                设备型号
                            </th>
                            <th scope="col" class="px-3 py-2 text-left text-xs font-medium text-danaher-800 uppercase tracking-wider">
                                序列号
                            </th>
                            <th scope="col" class="px-3 py-2 text-left text-xs font-medium text-danaher-800 uppercase tracking-wider">
                                安装日期
                            </th>
                            <th scope="col" class="px-3 py-2 text-left text-xs font-medium text-danaher-800 uppercase tracking-wider">
                                合约开始
                            </th>
                            <th scope="col" class="px-3 py-2 text-left text-xs font-medium text-danaher-800 uppercase tracking-wider">
                                合约结束
                            </th>
                            <th scope="col" class="px-3 py-2 text-left text-xs font-medium text-danaher-800 uppercase tracking-wider">
                                合约类型
                            </th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- 结果将通过JavaScript动态插入 -->
                        <tr class="text-center">
                            <td colspan="7" class="px-3 py-8 text-gray-500">
                                <i class="fa fa-info-circle mr-2"></i>请输入查询条件并点击查询按钮
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- 无结果提示 -->
            <div id="noResultMsg" class="hidden py-8 text-center text-gray-500">
                <i class="fa fa-search-minus text-3xl mb-2"></i>
                <p>没有找到符合条件的记录</p>
                <p class="text-sm mt-1">请尝试调整查询条件后重新查询</p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-danaher-900 text-white py-4 mt-8">
        <div class="container mx-auto px-4 text-center text-sm opacity-80">
            <p>© 2026 </p>
            <p class="mt-1">IB 设备管理系统 - 移动查询端</p>
        </div>
    </footer>

        // DOM元素
        const partyNameInput = document.getElementById('partyName');
        const modelTestInput = document.getElementById('modelTest');
        const serialNumberInput = document.getElementById('serialNumber');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const resultTableBody = document.getElementById('resultTableBody');
        const noResultMsg = document.getElementById('noResultMsg');
        const totalCountEl = document.getElementById('total-count');
        const resultCountEl = document.getElementById('result-count');
        
        // 初始化总记录数
        totalCountEl.textContent = equipmentData.length;
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 绑定查询按钮事件
            searchBtn.addEventListener('click', performSearch);
            
            // 绑定复位按钮事件
            resetBtn.addEventListener('click', resetSearch);
            
            // 绑定导出按钮事件
            exportBtn.addEventListener('click', exportResults);
            
            // 绑定回车键查询
            [partyNameInput, modelTestInput, serialNumberInput].forEach(input => {
                input.addEventListener('keyup', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            });
        });
        
        /**
         * 执行查询操作
         */
        function performSearch() {
            // 获取查询条件
            const partyName = partyNameInput.value.trim().toLowerCase();
            const modelTest = modelTestInput.value.trim().toLowerCase();
            const serialNumber = serialNumberInput.value.trim().toLowerCase();
            
            // 执行模糊查询
            const results = equipmentData.filter(item => {
                const matchesParty = item.PARTY_NAME.toLowerCase().includes(partyName);
                const matchesModel = item.MODEL_TEST.toLowerCase().includes(modelTest);
                const matchesSerial = item.SERIAL_NUMBER.toLowerCase().includes(serialNumber);
                
                return matchesParty && matchesModel && matchesSerial;
            });
            
            // 显示查询结果
            displayResults(results);
        }
        
        /**
         * 显示查询结果
         */
        function displayResults(results) {
            // 清空之前的结果
            resultTableBody.innerHTML = '';
            resultCountEl.textContent = results.length;
            
            // 检查是否有结果
            if (results.length === 0) {
                noResultMsg.classList.remove('hidden');
                return;
            }
            
            // 隐藏无结果提示
            noResultMsg.classList.add('hidden');
            
            // 生成结果表格行
            results.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = index % 2 === 0 ? 'bg-white' : 'bg-danaher-50';
                
                // 处理空值显示
                const formatValue = (value) => value || '-';
                
                row.innerHTML = `
                    <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900">
                        ${formatValue(item.PARTY_NAME)}
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900">
                        ${formatValue(item.MODEL_TEST)}
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900">
                        ${formatValue(item.SERIAL_NUMBER)}
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900">
                        ${formatValue(item.安装日期)}
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900">
                        ${formatValue(item.合约开始日期)}
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900">
                        ${formatValue(item.合约结束日期)}
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900">
                        ${formatValue(item.合约类型)}
                    </td>
                `;
                
                resultTableBody.appendChild(row);
            });
        }
        
        /**
         * 复位查询条件
         */
        function resetSearch() {
            // 清空输入框
            partyNameInput.value = '';
            modelTestInput.value = '';
            serialNumberInput.value = '';
            
            // 清空结果表格
            resultTableBody.innerHTML = `
                <tr class="text-center">
                    <td colspan="7" class="px-3 py-8 text-gray-500">
                        <i class="fa fa-info-circle mr-2"></i>请输入查询条件并点击查询按钮
                    </td>
                </tr>
            `;
            
            // 重置结果计数和提示
            resultCountEl.textContent = '0';
            noResultMsg.classList.add('hidden');
            
            // 聚焦第一个输入框
            partyNameInput.focus();
        }
        
        /**
         * 导出查询结果
         */
        function exportResults() {
            // 先执行一次查询获取当前结果
            performSearch();
            
            // 获取当前结果计数
            const resultCount = parseInt(resultCountEl.textContent);
            
            if (resultCount === 0) {
                alert('没有可导出的查询结果，请先执行查询');
                return;
            }
            
            // 获取当前查询条件下的结果
            const partyName = partyNameInput.value.trim().toLowerCase();
            const modelTest = modelTestInput.value.trim().toLowerCase();
            const serialNumber = serialNumberInput.value.trim().toLowerCase();
            
            const results = equipmentData.filter(item => {
                const matchesParty = item.PARTY_NAME.toLowerCase().includes(partyName);
                const matchesModel = item.MODEL_TEST.toLowerCase().includes(modelTest);
                const matchesSerial = item.SERIAL_NUMBER.toLowerCase().includes(serialNumber);
                
                return matchesParty && matchesModel && matchesSerial;
            });
            
            // 准备导出数据（重命名列名使其更友好）
            const exportData = results.map(item => ({
                '客户名称': item.PARTY_NAME || '-',
                '设备型号': item.MODEL_TEST || '-',
                '序列号': item.SERIAL_NUMBER || '-',
                '安装日期': item.安装日期 || '-',
                '合约开始日期': item.合约开始日期 || '-',
                '合约结束日期': item.合约结束日期 || '-',
                '合约类型': item.合约类型 || '-'
            }));
            
            // 创建工作簿并导出
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "设备查询结果");
            
            // 生成文件名（包含查询时间）
            const now = new Date();
            const timestamp = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}`;
            const fileName = `设备查询结果_${timestamp}.xlsx`;
            
            // 导出Excel文件
            XLSX.writeFile(wb, fileName);
            
            // 显示导出成功提示
            alert(`成功导出 ${resultCount} 条记录到Excel文件`);
        }
    </script>
