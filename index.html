<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备信息查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- Tailwind 配置 - 自定义紫色系 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6B21A8',    // 深紫色主色
                        secondary: '#8B5CF6',  // 中紫色
                        light: '#C4B5FD',      // 浅紫色
                        ultraLight: '#F3E8FF', // 超浅紫色
                        dark: '#4C1D95',       // 暗紫色
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-gradient-purple {
                background: linear-gradient(135deg, #6B21A8 0%, #8B5CF6 100%);
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(107, 33, 168, 0.15);
            }
            .input-focus {
                @apply focus:border-secondary focus:ring-2 focus:ring-secondary/30 focus:outline-none;
            }
            .btn-hover {
                @apply hover:bg-dark transition-all duration-300 transform hover:scale-105;
            }
        }
    </style>
</head>
<body class="bg-ultraLight min-h-screen font-sans">
    <!-- 背景装饰 -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1/3 bg-gradient-purple opacity-10 rounded-b-full"></div>
        <div class="absolute bottom-0 right-0 w-2/3 h-1/2 bg-secondary opacity-5 rounded-t-full"></div>
        <div class="absolute top-1/2 left-1/4 w-1/2 h-1/2 bg-primary opacity-3 rounded-full"></div>
    </div>

    <div class="container mx-auto px-4 py-6 max-w-md">
        <!-- 标题区域 -->
        <div class="text-center mb-8 pt-4">
            <div class="inline-block p-3 bg-primary/10 rounded-full mb-4">
                <i class="fa fa-search text-primary text-3xl"></i>
            </div>
            <h1 class="text-[clamp(1.5rem,5vw,2rem)] font-bold text-gray-800 mb-2">设备信息查询</h1>
            <p class="text-gray-600 text-sm">输入查询条件，获取相关设备信息</p>
        </div>

        <!-- 查询表单 -->
        <div class="bg-white rounded-xl p-5 mb-6 card-shadow">
            <form id="searchForm" class="space-y-4">
                <!-- PARTY_NAME 查询 -->
                <div>
                    <label for="partyName" class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fa fa-building-o text-primary mr-1"></i>机构名称
                    </label>
                    <input type="text" id="partyName" name="partyName" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus text-sm"
                           placeholder="输入机构名称（支持模糊查询）">
                </div>

                <!-- MODEL_TEST 查询 -->
                <div>
                    <label for="modelTest" class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fa fa-cogs text-primary mr-1"></i>设备型号
                    </label>
                    <input type="text" id="modelTest" name="modelTest" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus text-sm"
                           placeholder="输入设备型号（支持模糊查询）">
                </div>

                <!-- SERIAL_NUMBER 查询 -->
                <div>
                    <label for="serialNumber" class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fa fa-barcode text-primary mr-1"></i>序列号
                    </label>
                    <input type="text" id="serialNumber" name="serialNumber" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus text-sm"
                           placeholder="输入序列号（支持模糊查询）">
                </div>

                <!-- 按钮区域 -->
                <div class="flex space-x-3 pt-2">
                    <button type="submit" class="flex-1 bg-primary text-white px-4 py-2 rounded-lg btn-hover text-sm font-medium flex items-center justify-center">
                        <i class="fa fa-search mr-2"></i>查询
                    </button>
                    <button type="button" id="resetBtn" 
                            class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition-all duration-300 text-sm font-medium flex items-center justify-center">
                        <i class="fa fa-refresh mr-2"></i>复位
                    </button>
                </div>
            </form>
        </div>

        <!-- 结果统计 -->
        <div id="resultStats" class="hidden bg-white/80 backdrop-blur-sm rounded-lg p-3 mb-4 text-center text-sm text-gray-700">
            <span id="statsText">找到 <strong class="text-primary">0</strong> 条匹配结果</span>
        </div>

        <!-- 导出按钮 -->
        <div id="exportContainer" class="hidden mb-6 text-center">
            <button id="exportBtn" 
                    class="bg-secondary text-white px-4 py-2 rounded-lg btn-hover text-sm font-medium inline-flex items-center">
                <i class="fa fa-download mr-2"></i>导出结果
            </button>
        </div>

        <!-- 结果列表 -->
        <div id="resultContainer" class="bg-white rounded-xl overflow-hidden card-shadow max-h-[50vh] overflow-y-auto">
            <div id="noResult" class="p-8 text-center hidden">
                <div class="inline-block p-3 bg-gray-100 rounded-full mb-3">
                    <i class="fa fa-folder-open-o text-gray-400 text-2xl"></i>
                </div>
                <p class="text-gray-500">暂无匹配数据</p>
            </div>

            <div id="resultList" class="divide-y divide-gray-100 hidden">
                <!-- 结果项将通过JS动态生成 -->
            </div>
        </div>

        <!-- 加载中提示 -->
        <div id="loading" class="hidden fixed inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center z-50">
            <div class="bg-white p-5 rounded-xl flex flex-col items-center">
                <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary mb-3"></div>
                <p class="text-gray-700">查询中...</p>
            </div>
        </div>
    </div>

        // DOM元素
        const searchForm = document.getElementById('searchForm');
        const resetBtn = document.getElementById('resetBtn');
        const resultList = document.getElementById('resultList');
        const noResult = document.getElementById('noResult');
        const resultStats = document.getElementById('resultStats');
        const statsText = document.getElementById('statsText');
        const exportContainer = document.getElementById('exportContainer');
        const exportBtn = document.getElementById('exportBtn');
        const loading = document.getElementById('loading');
        
        // 当前查询结果
        let currentResults = [];

        // 显示加载状态
        function showLoading() {
            loading.classList.remove('hidden');
        }

        // 隐藏加载状态
        function hideLoading() {
            loading.classList.add('hidden');
        }

        // 格式化日期显示（为空时显示占位符）
        function formatDateDisplay(dateStr) {
            return dateStr ? dateStr : '<span class="text-gray-400 text-xs">未设置</span>';
        }

        // 格式化合同类型显示
        function formatContractType(type) {
            return type ? type : '<span class="text-gray-400 text-xs">无</span>';
        }

        // 渲染查询结果
        function renderResults(results) {
            // 清空之前的结果
            resultList.innerHTML = '';
            currentResults = results;

            // 显示统计信息
            resultStats.classList.remove('hidden');
            statsText.innerHTML = `找到 <strong class="text-primary">${results.length}</strong> 条匹配结果`;

            if (results.length === 0) {
                // 显示无结果提示
                resultList.classList.add('hidden');
                noResult.classList.remove('hidden');
                exportContainer.classList.add('hidden');
            } else {
                // 显示结果列表
                resultList.classList.remove('hidden');
                noResult.classList.add('hidden');
                exportContainer.classList.remove('hidden');

                // 生成结果项
                results.forEach((item, index) => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'p-4 hover:bg-gray-50 transition-colors';
                    resultItem.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-medium text-gray-800 text-sm">
                                ${item.PARTY_NAME_处理}
                            </h3>
                            <span class="text-xs text-primary bg-primary/10 px-2 py-0.5 rounded-full">
                                ${index + 1}
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs text-gray-600 mb-2">
                            <div class="flex items-center">
                                <i class="fa fa-cogs text-primary/70 w-3 mr-1"></i>
                                ${item.MODEL_TEST_处理}
                            </div>
                            <div class="flex items-center">
                                <i class="fa fa-barcode text-primary/70 w-3 mr-1"></i>
                                ${item.SERIAL_NUMBER_处理}
                            </div>
                        </div>
                        <div class="space-y-1 text-xs">
                            <div class="flex justify-between">
                                <span class="text-gray-500">安装日期:</span>
                                <span>${formatDateDisplay(item.安装日期_格式化)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">合约开始:</span>
                                <span>${formatDateDisplay(item.合同开始日期_格式化)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">合约结束:</span>
                                <span>${formatDateDisplay(item.合同结束日期_格式化)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">合约类型:</span>
                                <span>${formatContractType(item.合同类型_处理)}</span>
                            </div>
                        </div>
                    `;
                    resultList.appendChild(resultItem);
                });
            }
        }

        // 执行查询
        function performSearch() {
            showLoading();

            // 获取查询条件（去除空格并转为小写）
            const partyName = document.getElementById('partyName').value.trim().toLowerCase();
            const modelTest = document.getElementById('modelTest').value.trim().toLowerCase();
            const serialNumber = document.getElementById('serialNumber').value.trim().toLowerCase();

            // 模拟查询延迟，提升用户体验
            setTimeout(() => {
                // 过滤数据（模糊查询）
                const filteredResults = equipmentData.filter(item => {
                    const matchesParty = partyName === '' || item.PARTY_NAME_处理.toLowerCase().includes(partyName);
                    const matchesModel = modelTest === '' || item.MODEL_TEST_处理.toLowerCase().includes(modelTest);
                    const matchesSerial = serialNumber === '' || item.SERIAL_NUMBER_处理.toLowerCase().includes(serialNumber);
                    
                    return matchesParty && matchesModel && matchesSerial;
                });

                // 渲染结果
                renderResults(filteredResults);
                hideLoading();

                // 滚动到结果区域
                document.getElementById('resultContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        // 重置表单
        function resetForm() {
            searchForm.reset();
            resultList.classList.add('hidden');
            noResult.classList.add('hidden');
            resultStats.classList.add('hidden');
            exportContainer.classList.add('hidden');
            currentResults = [];
        }

        // 导出查询结果为Excel
        function exportResults() {
            if (currentResults.length === 0) return;

            // 准备导出数据
            const exportData = currentResults.map(item => ({
                '机构名称': item.PARTY_NAME_处理,
                '设备型号': item.MODEL_TEST_处理,
                '序列号': item.SERIAL_NUMBER_处理,
                '安装日期': item.安装日期_格式化 || '未设置',
                '合约开始日期': item.合同开始日期_格式化 || '未设置',
                '合约结束日期': item.合同结束日期_格式化 || '未设置',
                '合约类型': item.合同类型_处理 || '无'
            }));

            // 创建工作簿和工作表
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "设备查询结果");

            // 生成文件名（包含日期）
            const dateStr = new Date().toISOString().slice(0, 10);
            const fileName = `设备查询结果_${dateStr}.xlsx`;

            // 导出文件
            XLSX.writeFile(wb, fileName);
        }

        // 事件监听
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            performSearch();
        });

        resetBtn.addEventListener('click', resetForm);

        exportBtn.addEventListener('click', exportResults);

        // 初始化 - 默认隐藏结果区域
        resetForm();
    </script>
